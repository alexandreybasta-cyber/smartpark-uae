<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpotSense Vision &mdash; opening camera console</title>
<meta http-equiv="refresh" content="0; url=https://api.spotsense.app/camera" />
<style>
  html,body{margin:0;height:100%;background:#ffffff;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1e293b}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .logo svg{width:30px;height:30px}
  .spin{width:22px;height:22px;border:3px solid rgba(249,115,22,.25);border-top-color:#f97316;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  p{color:#64748b;font-size:14px;margin:0}
  a{color:#ea580c;font-weight:600;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none"><rect x="2" y="6" width="28" height="20" rx="4" stroke="#1e293b" stroke-width="2"/><path d="M16 10v12M10 16h12" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/><circle cx="16" cy="16" r="3" fill="#f97316" opacity=".35"/></svg>
      SpotSense Vision
    </div>
    <div class="spin"></div>
    <p>Opening the camera occupancy console&hellip;</p>
    <p><a href="https://api.spotsense.app/camera">Continue to api.spotsense.app/camera</a></p>
  </div>
  <script>location.replace("https://api.spotsense.app/camera");</script>
</body>
</html>
